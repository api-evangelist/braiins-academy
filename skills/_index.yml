cross_cutting_rules:
  - No idempotency key exists on any Braiins API — never blind-retry a mutating call; re-read state first.
  - >-
    Braiins Hashpower returns the error reason in the URL-encoded `grpc-message` RESPONSE HEADER,
    not the body.
  - >-
    No rate-limit response headers on any surface; budgets are published (100/min per credential,
    500/min per IP on anonymous market data, ~1 per 5s on Braiins Pool) and must be tracked client-side.
  - >-
    The Braiins OS Public API's server is the miner itself. There is no Braiins-hosted endpoint
    and no sandbox — every call reaches a physical machine.
