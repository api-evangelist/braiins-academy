specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Braiins
providerId: braiins-academy
generated: '2026-09-04'
method: searched
source: >-
  https://braiins.com/manager/pricing, https://academy.braiins.com/braiins-hashpower/fees.md,
  https://braiins.com/os-firmware (Braiins OS licence + dev fee), https://braiins.com/pool
created: '2026-05-04'
modified: '2026-09-04'
supersedes: >-
  The 2026-05-04 bulk-sweep scaffold, which invented Free/Professional/Enterprise API tiers with
  made-up request quotas. Braiins does not sell API plans by request volume; it sells software
  and takes a share of hashrate. Every figure below is quoted from a Braiins page.
tags:
  - Bitcoin Mining
  - Mining Pool
  - Mining Firmware
  - Hashrate Marketplace
description: >-
  Braiins monetises three different ways and only one of them looks like an API plan. Braiins
  Manager sells seats-free/MW-priced SaaS and gates Public API access behind the Pro tier.
  Braiins OS charges a hashrate dev fee rather than money. Braiins Pool and Braiins Hashpower
  charge a percentage of mining revenue and trading volume. The APIs themselves are not
  separately priced.
plan_count: 8
plans:
  - id: braiins-manager-basic
    product: Braiins Manager
    name: Basic
    type: free
    price: '0.00'
    currency: USD
    billing_period: null
    included: Unlimited devices; dashboard, workers, sitemap, energy reports, hosting management,
      issue tracker, team management.
    api_access: false
    api_note: Public API access is NOT included in Basic.
    signup: https://braiins.com/manager
  - id: braiins-manager-pro
    product: Braiins Manager
    name: Pro
    type: usage
    price: '250.00'
    currency: USD
    unit: MW
    billing_period: month
    stated_as: $250 MW / Month
    included: >-
      Everything in Basic, plus Controlflow automation, Strike Price Curtailment, Demand Response,
      Premium Support, and Public API Access ("Generate API credentials to securely access
      Braiins Manager and integrate it with your tools and automation").
    api_access: true
    onboarding: Contact Sales
  - id: braiins-manager-enterprise
    product: Braiins Manager
    name: Enterprise
    type: contact-sales
    price: null
    currency: null
    included: >-
      Everything in Pro, plus Price Adapt, Energy Intelligence, and Increased API Usage
      ("increase your API request limits to support higher-volume integrations and automation").
    api_access: true
    api_note: The only tier with raised API limits. No numeric limit is published for any tier.
    onboarding: Contact Sales
  - id: braiins-os-licence
    product: Braiins OS
    name: Braiins OS firmware licence
    type: revenue-share
    price: null
    currency: null
    stated_as: >-
      A development fee of roughly 2-2.5% of hashing power (the exact figure depends on the
      hardware model), taken by directing that share of hashrate to Braiins Pool. The licence is
      valid for one month and renews automatically.
    included: Autotuning, Dynamic Performance Scaling, Stratum V2 support, the Braiins OS Public API.
    api_access: true
    api_note: The Braiins OS Public API is included with the firmware; it is not separately licensed.
    terms: https://braiins.com/os/plus/license
  - id: braiins-os-on-braiins-pool
    product: Braiins OS + Braiins Pool
    name: Braiins OS mining to Braiins Pool
    type: bundle
    price: '0.00'
    stated_as: 0% effective pool fee when running Braiins OS and mining to Braiins Pool.
    note: The dev fee and the pool fee cancel out; this is Braiins' core commercial hook.
  - id: braiins-pool
    product: Braiins Pool
    name: Braiins Pool (FPPS)
    type: revenue-share
    price: null
    stated_as: >-
      FPPS rewards; 0% fees with Braiins OS. Braiins does not state the standard non-Braiins-OS
      pool fee percentage on the pool landing page, and the reward-and-fees detail sits behind a
      help-centre article (https://help.braiins.com/en/support/solutions/articles/77000426262).
    api_access: true
    api_note: >-
      The Braiins Pool JSON API is free with any account; access is enabled per access profile,
      not per plan.
    non_kyc: true
  - id: braiins-hashpower-spot
    product: Braiins Hashpower
    name: Spot market
    type: transaction-fee
    price: '0.00'
    stated_as: >-
      Spot Bid Fee 0% during the beta period, charged continuously from the settled amount during
      order execution; the rate may change when the platform exits beta.
    settlement_interval: hourly
    api_access: true
    api_note: >-
      API tokens are issued at registration; market data is callable with no credential at all.
    evidence: https://academy.braiins.com/braiins-hashpower/fees.md
  - id: braiins-hashpower-contracts
    product: Braiins Hashpower
    name: Fixed-duration contracts
    type: usage
    price: null
    stated_as: >-
      Priced per contract; the live schedule is readable from the API itself —
      GET /contract/pricing (getCurrentContractPricing) and GET /contract/cancel-fee
      (getCurrentContractCancelFees), with POST /contract/quote returning a binding-free quote
      including the cancellation-weighted premium.
    machine_readable_pricing: true
    api_access: true
findings:
  - >-
    Braiins Hashpower is the rare case where the price list is an API: three operations return
    live pricing, fee layers and cancellation fees, so an agent can cost an action before taking
    it. Recorded as machine_readable_pricing on that plan.
  - >-
    Braiins Manager is the only product where API access is a paid feature gate, and the gate is
    coarse — Pro turns the API on, Enterprise raises unpublished limits.
  - >-
    No plan anywhere is priced by API request volume.
maintainers:
