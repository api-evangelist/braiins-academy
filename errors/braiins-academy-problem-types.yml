description: >-
  Neither Braiins REST surface returns a machine-readable error body. Hashpower defines its error
  responses as reusable components with descriptions but no schema, and puts the human-readable
  reason in a URL-encoded `grpc-message` RESPONSE HEADER. Braiins OS declares status codes with
  prose descriptions only. This catalogue is therefore a status-code registry plus the documented
  meanings, not an RFC 9457 problem-type list — because there is nothing shaped like one to
  harvest.
envelope:
  hashpower:
    body: none — the reusable responses declare a description and no content schema
    header: 'grpc-message'
    header_encoding: URL-encoded UTF-8
    header_example: 'Bid%20duration%20too%20short%20(estimate:%209.29,%20limit:%201800)'
    remediation: >-
      Clients must read and percent-decode the grpc-message response header to get any detail;
      the status code alone does not say which field or rule failed.
  bos:
    body: none declared
    header: none documented
