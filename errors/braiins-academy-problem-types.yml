device_state_reasons:
  note: >-
    Braiins OS does publish a machine-readable failure vocabulary, but it lives in the miner
    STATUS rather than in error responses — the MinerDetailedStatus status oneof added in Public
    API 1.14.0. An agent diagnosing "why is this miner not hashing" reads this, not an error body.
  source: >-
    https://academy.braiins.com/braiins-os/miner-states.md,
    grpc/braiins-academy-bos-miner.proto
  reasons:
