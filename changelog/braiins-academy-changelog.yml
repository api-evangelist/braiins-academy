findings:
  - >-
    The published REST OpenAPI declares info.version 1.7.0 while the gRPC contract it mirrors is
    at 1.14.0. Braiins states the two transports "provide the same functionality"; the document
    version does not corroborate that.
  - >-
    Deprecations are announced in the changelog with a named replacement, but no Deprecation or
    Sunset response header is emitted and no removal date is given.
