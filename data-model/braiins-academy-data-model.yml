findings:
- Braiins Hashpower has no single canonical Order/Contract schema — the surface is response-shaped (SpotGetBidsResponse,
  GetContractDetailResponse) rather than resource-shaped, so a client models the entities from response
  wrappers.
- 'The Braiins OS graph is deeply nested (158 schemas for 63 operations) because it encodes hardware:
  temperature sensors, fans, hashboards and per-chip tuning profiles are all first-class.'
- No cross-product entity. Braiins Pool, the third surface, publishes no schema at all — its six JSON
  documents are described in prose tables only.
