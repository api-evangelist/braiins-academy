  - changelog: bos-public-api
    version: 1.14.0
    date: '2026-08-13'
    breaking: false
    additions:
      - Server-streaming RPC GetMinerDetailedStatus on braiins.bos.v1.MinerService.
      - Messages GetMinerDetailedStatusRequest / GetMinerDetailedStatusResponse and MinerDetailedStatus.
      - Status oneof members ExpectedTime, Unspecified, ApplicationUnavailable, UnsupportedHardware,
        DeadPools, MissingLicense, UserPause, ThermalPause, DpsCooldown, TunerError, HardwareError,
        DelayedStart, CoolingDown, WaitingWhileCold, Defrosting, Normal, Preheating.
      - Enum ThermalPauseReason.
      - Optional field keep_existing on ApplyContractKeyRequest, to retain licences already on the miner.
      - Field detailed_status on GetMinerDetailsResponse.
    deprecations:
      - GetMinerStatus on MinerService, superseded by GetMinerDetailedStatus.
    highlights: >-
      Deprecates the coarse miner status in favour of a detailed status carrying the REASON a
      miner is not hashing — the change an automation consumer most needs.
