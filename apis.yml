  - type: Sandbox
    url: https://pool.braiins.com/demo-login/
  - type: TermsOfService
    url: https://braiins.com/pool/terms-and-conditions-braiins-mining-limited
  - type: PrivacyPolicy
    url: https://braiins.com/pool/braiins-pool-privacy-policy
