description: >-
  Braiins publishes no first-party client SDK on any package registry. The Braiins OS Public API
  ships as a contract (proto + OpenAPI) and Braiins points integrators at generic gRPC tooling
  (grpcurl, gRPCui, Postman) rather than at a generated client. The distributables Braiins does
  publish — Braiins Toolbox, the Braiins Manager Agent, Braiins OS itself — are installers and
  binaries, not registry packages. Everything on a registry with "braiins" in its name is
  community-built.
