        affected_ids:
          type: array
          items:
            type: string
        failure_code:
          type: string
        failure_reason:
          type: string
    TerminateContractResponse:
      type: object
      required:
      - affected_ids
      properties:
        affected_ids:
          type: array
          items:
            type: string
    GetContractDetailResponse:
      type: object
      required:
      - contract
      - state
      properties:
        contract:
          $ref: '#/components/schemas/ContractPublic'
        state:
          $ref: '#/components/schemas/ContractStatePublic'
    TerminateContractRequest:
      type: object
      properties:
        memo:
          type: string
          description: Optional memo or reason.
    CancelContractRequest:
      type: object
      properties:
        memo:
          type: string
          description: Optional memo or reason.
    ContractActivityItem:
      type: object
      required:
      - cursor
      - contract_id
      - type
      - occurred_at
      - effective_date
      - amount
      - message
      - details_json
      properties:
        cursor:
          type: integer
          format: uint64
          minimum: 0
        contract_id:
          type: string
          description: Contract ID prefixed with C.
        type:
          $ref: '#/components/schemas/ContractActivityType'
        occurred_at:
          type: string
          format: date-time
          description: Event creation time in UTC.
        effective_date:
          type: string
          description: Accounting day in YYYY-MM-DD format, or an empty string when not applicable.
        amount:
          $ref: '#/components/schemas/Int64'
          description: Primary event amount in satoshis, or zero when not applicable.
        message:
          type: string
          description: Human-readable event summary.
        details_json:
          type: string
          description: Additional machine-readable values encoded as a JSON object.
    ContractCreationQuoteStatus:
      type: string
      enum:
      - CONTRACT_CREATION_QUOTE_STATUS_UNSPECIFIED
      - CONTRACT_CREATION_QUOTE_STATUS_SUCCESS
      - CONTRACT_CREATION_QUOTE_STATUS_FAILED
    ContractActivityType:
      type: string
      enum:
      - CONTRACT_ACTIVITY_TYPE_UNSPECIFIED
      - CONTRACT_ACTIVITY_TYPE_RESERVATION
      - CONTRACT_ACTIVITY_TYPE_SETTLEMENT
      - CONTRACT_ACTIVITY_TYPE_AUTO_TERMINATION
      - CONTRACT_ACTIVITY_TYPE_FUNDING_WARNING
      - CONTRACT_ACTIVITY_TYPE_SETTLEMENT_BLOCKED
      - CONTRACT_ACTIVITY_TYPE_LATE_YIELD
    QuoteContractCreationResponse:
      type: object
      required:
      - status
      - reason_code
      - reason
      - account_available_balance
      - fpps_share_price
      - rate_pct
      - hashrate_cost
      - fee_amount
      - initial_reservation_amount
      - available_speed_ph
      - quote_reason
      - hashrate_cost_reservation_amount
      - premium_reservation_amount
      - cancellation_buffer_reservation_amount
      - cancel_fee_pct
      properties:
        status:
          $ref: '#/components/schemas/ContractCreationQuoteStatus'
        reason_code:
          type: string
          description: Empty when status is SUCCESS; otherwise a stable machine-readable rejection code.
        reason:
          type: string
          description: Empty when status is SUCCESS; otherwise a human-readable rejection reason.
        account_available_balance:
          $ref: '#/components/schemas/Int64'
          description: Caller account available BTC balance in satoshis.
        fpps_share_price:
          type: string
          description: Order-time FPPS share price from SharePrice service, BTC per difficulty-unit as a decimal string.
        rate_pct:
          type: string
          description: Selected pricing fee/markup rate in percent as a decimal string.
        hashrate_cost:
          $ref: '#/components/schemas/Int64'
          description: Buyer principal hashrate cost for the whole contract in satoshis.
        fee_amount:
          $ref: '#/components/schemas/Int64'
          description: Total selected fee/markup for the whole contract in satoshis.
        initial_reservation_amount:
          $ref: '#/components/schemas/Int64'
          description: Total initial reservation amount in satoshis.
        available_speed_ph:
          $ref: '#/components/schemas/Double'
          description: Available contract hashrate for the requested window in PH/s.
        quote_reason:
          $ref: '#/components/schemas/ContractCreationQuoteReason'
          description: Typed rejection reason for generated clients. UNSPECIFIED when status is SUCCESS.
        hashrate_cost_reservation_amount:
          $ref: '#/components/schemas/Int64'
          description: Hashrate-principal portion of the upfront reservation in satoshis.
        premium_reservation_amount:
          $ref: '#/components/schemas/Int64'
          description: Premium portion of the Forward Funding Window reservation in satoshis.
        cancellation_buffer_reservation_amount:
          $ref: '#/components/schemas/Int64'
          description: Cancellation-weighted premium on the Contractual Funding Tail beyond the Forward Funding Window, in satoshis.
        cancel_fee_pct:
          type: string
          description: Cancellation fee as a percentage of unpaid remaining contract premium.
    OptionalDouble:
      description: Optional double value.
      type: object
      properties:
        value:
          $ref: '#/components/schemas/Double'
    ContractStatus:
      type: string
      enum:
      - CONTRACT_STATUS_UNSPECIFIED
      - CONTRACT_STATUS_PENDING
      - CONTRACT_STATUS_RUNNING
      - CONTRACT_STATUS_FINISHED
      - CONTRACT_STATUS_CANCELED
      - CONTRACT_STATUS_PAUSED
      - CONTRACT_STATUS_TERMINATED
    ContractCancellationRequestState:
      type: string
      enum:
      - CONTRACT_CANCELLATION_REQUEST_STATE_UNSPECIFIED
      - CONTRACT_CANCELLATION_REQUEST_STATE_PENDING
      - CONTRACT_CANCELLATION_REQUEST_STATE_ACCEPTED_BY_FLUX
      - CONTRACT_CANCELLATION_REQUEST_STATE_REJECTED_BY_FLUX
      - CONTRACT_CANCELLATION_REQUEST_STATE_CONFIRMED_RELEASED
      - CONTRACT_CANCELLATION_REQUEST_STATE_RELEASE_FAILED
    UpstreamContractDestination:
      type: object
      required:
      - upstream
      properties:
        upstream:
          $ref: '#/components/schemas/UpstreamSpecification'
    Double:
      type: number
      format: double
    GetContractSpeedHistoryItem:
      type: object
      required:
      - timestamp
      - speed_ph
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the hashrate measurement.
        speed_ph:
          $ref: '#/components/schemas/Double'
          description: Estimated hashrate in PH/s.
    GetContractDeliveryHistoryItem:
      type: object
      required:
      - timestamp
      - shares_delivered_m
      - shares_accepted_m
      - shares_rejected_m
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the delivery record.
        shares_delivered_m:
          $ref: '#/components/schemas/Double'
          description: Shares delivered (validated by platform). In millions.
        shares_accepted_m:
          $ref: '#/components/schemas/Double'
          description: Shares accepted by the target. In millions.
        shares_rejected_m:
          $ref: '#/components/schemas/Double'
          description: Shares rejected by the target. In millions.
  responses:
    Unauthorized:
      description: The `apikey` header is missing or does not contain a valid API credential.
    TooManyRequests:
      description: The applicable per-credential or per-client-IP request limit was exceeded. Retry after reducing request frequency.
    ServiceError:
      description: The gateway or upstream service could not complete the request. The response body and status depend on the failing boundary.
    Forbidden:
      description: The API credential is valid but its ACL role or resource ownership does not permit this operation.
    BadRequest:
      description: The path, query, or JSON body is invalid, violates a market rule, or contains mutually exclusive fields.
    NotFound:
      description: The requested caller-visible resource does not exist.
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: apikey
      description: API credential issued for a Braiins Hashpower account. The credential's ACL role and resource ownership determine which authenticated operations and records are available.
