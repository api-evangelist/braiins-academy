        label:
          type: string
        valid_from:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp from which this pricing layer is valid.
        valid_to:
          type: string
          description: RFC3339 UTC timestamp at which this pricing layer stops being valid. Empty means open-ended.
        bands:
          type: array
          items:
            $ref: '#/components/schemas/CurrentContractPricingBand'
    GetContractActivityResponse:
      type: object
      required:
      - items
      - next_cursor
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractActivityItem'
        next_cursor:
          type: integer
          format: uint64
          minimum: 0
          description: Cursor of the final returned item, or the request cursor when no items were returned.
        has_more:
          type: boolean
          description: True when more matching events are currently available.
    GetContractsResponseItem:
      type: object
      required:
      - contract
      - state
      properties:
        contract:
          $ref: '#/components/schemas/ContractPublic'
        state:
          $ref: '#/components/schemas/ContractStatePublic'
    Uint32:
      type: integer
      format: uint32
      minimum: 0
      maximum: 4294967295
    QuoteContractCreationRequest:
      type: object
      required:
      - pow_algo
      - speed_ph
      - activates_at
      - expires_at
      properties:
        pow_algo:
          type: string
          description: 'Proof-of-work algorithm. Canonical spelling: `sha256`; parsing is ASCII case-insensitive.'
        speed_ph:
          $ref: '#/components/schemas/Double'
          description: Contract hashrate in PH/s.
        activates_at:
          type: string
          format: date-time
          description: Desired activation datetime of the contract.
        expires_at:
          type: string
          format: date-time
          description: Desired expiration datetime of the contract.
    CurrentContractPricingBand:
      type: object
      required:
      - shares_to
      - premium_pct
      properties:
        shares_to:
          type: string
          description: Exclusive upper bound in difficulty-1 shares. Empty means open-ended top band.
        premium_pct:
          type: string
          description: Markup/fee percentage as a normalized decimal string.
    ScheduleContractResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: Contract ID prefixed with C.
    CurrentContractCancelFeeLayerKind:
      type: string
      enum:
      - CURRENT_CONTRACT_CANCEL_FEE_LAYER_KIND_UNSPECIFIED
      - CURRENT_CONTRACT_CANCEL_FEE_LAYER_KIND_GLOBAL
      - CURRENT_CONTRACT_CANCEL_FEE_LAYER_KIND_PROMO
      - CURRENT_CONTRACT_CANCEL_FEE_LAYER_KIND_USER
    ContractHistoryAggregationPeriod:
      type: string
      description: Aggregation period for contract history time series.
      enum:
      - PERIOD_UNSPECIFIED
      - PERIOD_5_MINUTES
      - PERIOD_15_MINUTES
      - PERIOD_1_HOUR
      - PERIOD_4_HOURS
    GetContractReservationsResponse:
      type: object
      required:
      - contract_id
      - items
      properties:
        contract_id:
          type: string
          description: Contract ID prefixed with C.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractReservationPublicItem'
    ContractSettlementPublicItem:
      type: object
      required:
      - settlement_date
      - bare_price_amount
      - premium_amount
      - pps_rate_for_day
      - shares_for_day
      - created_at
      - cancellation_fee_amount
      - is_final
      properties:
        settlement_date:
          type: string
          description: Settlement day in YYYY-MM-DD format.
        bare_price_amount:
          $ref: '#/components/schemas/Int64'
          description: Bare PPS price component in the implicit settlement currency smallest unit.
        premium_amount:
          $ref: '#/components/schemas/Int64'
          description: Premium component in the implicit settlement currency smallest unit.
        pps_rate_for_day:
          $ref: '#/components/schemas/Double'
          description: Indicative PPS rate used for this row. Derived from finalized daily pricing for delivered shares; a final row without delivery may use the cancellation price.
        shares_for_day:
          $ref: '#/components/schemas/Double'
          description: Shares delivered for this accounting day. Zero records a completed day with no delivery.
        released_amount:
          type: integer
          format: int64
          nullable: true
          description: Smallest-unit amount released by the final settlement row. Null or omitted for non-final rows.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the settlement row was recorded.
        cancellation_fee_amount:
          $ref: '#/components/schemas/Int64'
          description: Fee charged from unrealized remaining contract premium on termination.
        is_final:
          type: boolean
          description: True when this row completed accounting and released the remaining locked funds.
        cancellation_share_price_btc:
          type: string
          description: Exact BTC-per-difficulty-unit price used to calculate the final cancellation fee, encoded as a decimal string. Omitted when cancellation pricing was not required.
    SlidingWindowSize:
      type: string
      description: Sliding window size for estimating hashrate.
      enum:
      - WINDOW_SIZE_UNSPECIFIED
      - WINDOW_SIZE_10_MINUTES
      - WINDOW_SIZE_20_MINUTES
      - WINDOW_SIZE_30_MINUTES
    GetCurrentContractPricingResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CurrentContractPricingLayer'
    ContractReservationPublicItem:
      type: object
      required:
      - effective_at
      - amount
      - origin
      - created_at
      - cancellation_buffer_amount
      properties:
        effective_at:
          type: string
          format: date-time
          description: Logical timestamp represented by this reservation.
        amount:
          $ref: '#/components/schemas/Int64'
          description: Incremental amount blocked by this reservation in the smallest unit of the implicit contract settlement currency.
        origin:
          $ref: '#/components/schemas/ContractReservationOriginPublic'
        created_at:
          type: string
          format: date-time
          description: Timestamp when the reservation row was recorded.
        cancellation_buffer_amount:
          $ref: '#/components/schemas/Int64'
          description: Portion of this reservation attributed to newly required cancellation-fee coverage after accounting for amounts already covered. This is not an additional reservation or the final cancellation fee.
        share_price_btc:
          type: string
          description: Exact BTC-per-difficulty-unit price used for this reservation, encoded as a decimal string. Omitted when no pricing evidence is available.
    LocalContractDestination:
      type: object
      required:
      - local
      properties:
        local:
          type: integer
          enum:
          - 0
    ContractStatePublic:
      type: object
      required:
      - shares_claimed
      - shares_yielded
      - shares_sold
      - shares_delivered
      - shares_accepted
      - shares_rejected
      - avg_speed_ph
      - progress
      properties:
        shares_claimed:
          $ref: '#/components/schemas/Double'
        shares_yielded:
          $ref: '#/components/schemas/Double'
        shares_sold:
          $ref: '#/components/schemas/Double'
        shares_delivered:
          $ref: '#/components/schemas/Double'
        shares_accepted:
          $ref: '#/components/schemas/Double'
        shares_rejected:
          $ref: '#/components/schemas/Double'
        avg_speed_ph:
          $ref: '#/components/schemas/Double'
          description: Contract hashrate estimate in PH/s.
        progress:
          $ref: '#/components/schemas/Double'
          description: Progress in percents from 0 to 100.
    GetContractSettingsResponse:
      type: object
      required:
      - min_speed_ph
      - max_speed_ph
      - min_duration_seconds
      - max_duration_seconds
      - min_start_gap_seconds
      - min_cancellation_gap_seconds
      - reservation_lead_days
      - max_start_gap_days
      properties:
        min_speed_ph:
          type: number
          format: double
          description: Minimum allowed contract hashrate in PH/s.
        max_speed_ph:
          type: number
          format: double
          description: Maximum allowed contract hashrate in PH/s.
        min_duration_seconds:
          type: integer
          format: int64
        max_duration_seconds:
          type: integer
          format: int64
        min_start_gap_seconds:
          type: integer
          format: int64
        min_cancellation_gap_seconds:
          type: integer
          format: int64
        reservation_lead_days:
          type: string
          description: Reservation lead time in days as an exact decimal string.
        max_start_gap_days:
          type: integer
          format: int64
          description: Maximum allowed number of days between the request time and contract activation.
    CurrentContractPricingLayerKind:
      type: string
      enum:
      - CURRENT_CONTRACT_PRICING_LAYER_KIND_UNSPECIFIED
      - CURRENT_CONTRACT_PRICING_LAYER_KIND_GLOBAL
      - CURRENT_CONTRACT_PRICING_LAYER_KIND_PROMO
      - CURRENT_CONTRACT_PRICING_LAYER_KIND_USER
    UpstreamSpecification:
      type: object
