findings:
  - >-
    Zero first-party SDKs on any registry. This is the largest developer-ergonomics gap in the
    Braiins surface: three real API contracts and no generated client for any of them.
  - >-
    The only official example code (bos-plus-api-demos) has not been touched since 2024-05-14
    and predates both the REST API (added in Braiins OS 25.07) and eight releases of the gRPC
    contract — a dated abandonment signal on the one artifact a new integrator would open first.
