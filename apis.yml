  humanURL: https://academy.braiins.com/braiins-os/papi-about.md
  baseURL: http://miner/api/v1
  description: 'The Braiins OS Public API, introduced in Braiins OS 23.03, is the control contract for
    a Bitcoin ASIC running Braiins OS. It is offered over gRPC (package braiins.bos.v1, TCP 50051) and,
    since Braiins OS 25.07, over REST — Braiins states both transports provide the same functionality.
    The API runs ON the miner: servers[] is http://miner/, so the host is each device on the operator''s
    own network and there is no Braiins-hosted endpoint. 63 REST operations cover mining actions, performance
    and power targeting, Dynamic Performance Scaling, cooling, pool groups, licensing, network configuration,
    firmware upgrade and restore-to-stock, and a detailed miner status that reports the reason a machine
    is not hashing. Every miner also self-serves its own OpenAPI at GET /api/v1/docs/openapi.json.'
