- aid: braiins-academy:braiins-hashpower-api
  name: Braiins Hashpower API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/braiins-academy.png
  tags:
  - Hashrate Marketplace
  - Bitcoin
  - Trading
  - Contracts
  - Market Data
  humanURL: https://academy.braiins.com/braiins-hashpower/api.md
  baseURL: https://hashpower.braiins.com/v1
  description: 'Public HTTP API for the Braiins Hashpower marketplace: buying hashrate on the spot market,
    scheduling fixed-duration contracts with guaranteed delivery, and reading account and market data.
    35 operations across bid orders, contracts, accounts, market data and market configuration, published
    as OpenAPI 3.1.0 and rendered in Scalar at https://hashpower.braiins.com/api. Authentication is an
    API key in the apikey header, scoped by ACL role (owner for trading, read-only for viewing); the four
    market-data operations are callable anonymously. Every operation publishes its own rate limit in the
    contract. Notable for two advisory operations — quoteContractCreation and checkContractSpeedAvailability
    — that let a caller cost and validate a contract without reserving funds or capacity. Braiins labels
    Hashpower a beta product and the 0% spot bid fee is stated to apply during the beta period.'
  properties:
