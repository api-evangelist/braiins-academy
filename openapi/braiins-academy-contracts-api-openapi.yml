        identity:
          type: string
          description: User / worker identification
    ContractDestination:
      oneOf:
      - $ref: '#/components/schemas/LocalContractDestination'
      - $ref: '#/components/schemas/UpstreamContractDestination'
    ScheduleContractRequest:
      type: object
      required:
