      properties:
        id:
          type: string
          description: Contract ID prefixed with C.
        issuer_subaccount:
          type: string
        subaccount:
          type: string
        destination:
          $ref: '#/components/schemas/ContractDestination'
        nominal_speed_ph:
          $ref: '#/components/schemas/Double'
          description: Contract nominal hashrate in PH/s.
        activates_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ContractStatus'
        pow_algo:
          type: string
        memo:
          type: string
        created_at:
          type: string
          format: date-time
        last_updated_at:
          type: string
          format: date-time
        last_status_change_timestamp:
          type: string
          format: date-time
        last_status_change_reason:
          $ref: '#/components/schemas/Uint32'
        last_status_change_remark:
          type: string
