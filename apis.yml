position: Producing
description: 'Braiins is a Prague-based Bitcoin mining technology company that operates the world''s longest-running
  Bitcoin mining pool (Slush Pool, now Braiins Pool, mining since 2010), builds Braiins OS autotuning
  ASIC firmware, and co-developed Stratum V2, the successor mining-pool protocol. Three of its products
  publish an API: Braiins OS ships a Public API over both gRPC and REST that runs on the miner itself
  (63 REST operations, 16 proto3 service files); Braiins Hashpower publishes an OpenAPI 3.1 contract for
  its spot hashrate marketplace and fixed-duration contracts (35 operations); and Braiins Pool exposes
  six read-only JSON endpoints for pool, worker and reward statistics. Braiins Manager gates its own public
  API behind a paid tier. Braiins completed a SOC 2 Type 2 audit in 2025 and publishes a vulnerability
  disclosure policy with a five-business-day response commitment.'
apis:
- aid: braiins-academy:braiins-pool-api
  name: Braiins Pool API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/braiins-academy.png
  tags:
  - Mining Pool
  - Bitcoin
  - Hashrate
  - Payouts
  - Statistics
  humanURL: https://academy.braiins.com/braiins-pool/monitoring.md
  baseURL: https://pool.braiins.com
  description: >-
    Read-only JSON API for Braiins Pool, the oldest active Bitcoin mining pool (first block 2010, 1.29M+
    BTC mined). Six documented endpoints: pool stats and recent blocks, user profile and rewards, daily
    rewards over a date range, daily hashrate for a user or group, and block rewards. Authentication is
    an access-profile token in the Pool-Auth-Token (or X-Pool-Auth-Token) header, generated per access
    profile after enabling "Allow access to web APIs". Braiins publishes a limit of approximately one
    request per five seconds and states that sustained excess can result in an IP ban. No machine-readable
    contract is published — the endpoints and response fields are documented in prose tables only.
  properties:
