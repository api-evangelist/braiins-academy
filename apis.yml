  humanURL: https://academy.braiins.com/braiins-pool/monitoring.md
  baseURL: https://pool.braiins.com
  description: 'Read-only JSON API for Braiins Pool, the oldest active Bitcoin mining pool (first block
    2010, 1.29M+ BTC mined). Six documented endpoints: pool stats and recent blocks, user profile and
    rewards, daily rewards over a date range, daily hashrate for a user or group, and block rewards. Authentication
    is an access-profile token in the Pool-Auth-Token (or X-Pool-Auth-Token) header, generated per access
    profile after enabling "Allow access to web APIs". Braiins publishes a limit of approximately one
    request per five seconds and states that sustained excess can result in an IP ban. No machine-readable
    contract is published — the endpoints and response fields are documented in prose tables only.'
  properties:
