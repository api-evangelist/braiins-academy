          $ref: '#/components/schemas/ContractDestination'
        speed_ph:
          $ref: '#/components/schemas/Double'
          description: Contract hashrate in PH/s.
        activates_at:
          type: string
          format: date-time
          description: Desired activation datetime of the contract.
        expires_at:
          type: string
          format: date-time
          description: Desired expiration datetime of the contract.
        pow_algo:
          type: string
          description: 'Proof-of-work algorithm. Canonical spelling: `sha256`; parsing is ASCII case-insensitive.'
        text:
          type: string
          description: Optional remark.
    ContractPublic:
      type: object
      required:
      - id
      - issuer_subaccount
      - subaccount
      - destination
      - nominal_speed_ph
      - activates_at
      - expires_at
      - status
