gaps:
  - >-
    No error schema on either published contract — a code generator produces clients that cannot
    type an error.
  - >-
    Putting the failure reason in a `grpc-message` header rather than the body is a leaked
    gateway detail; it works, it is documented, and it is invisible to every generic OpenAPI
    client.
  - >-
    Braiins OS firmware error codes referenced by the docs at
    https://academy.braiins.com/braiins-os/technical-resources.md#error-codes could not be
    harvested — that page returned an empty body on 2026-09-04.
