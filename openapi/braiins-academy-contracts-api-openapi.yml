        cancel_fee_pct:
          $ref: '#/components/schemas/OptionalDouble'
          description: Agreed cancellation fee as a percentage of unpaid remaining contract premium. Omitted while commercial terms are not yet available.
    ContractCancellationRequest:
      type: object
      properties:
        cancellation_request_id:
          type: integer
          format: uint64
          minimum: 0
