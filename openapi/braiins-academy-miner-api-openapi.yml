    GetMinerDetailsResponse:
      type: object
      description: Structure to handle system details
      required:
      - uid
      - platform
      - bos_mode
      - hostname
      - mac_address
      - system_uptime
      - bosminer_uptime_s
      - system_uptime_s
      - status
      - kernel_version
      - control_board_soc_family
      properties:
        bos_mode:
          type: integer
          format: int32
          description: BOS Mode
        bos_version:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BosVersion'
            description: OS Version
        bosminer_uptime_s:
          type: integer
          format: int64
          description: Bosminer uptime. `0` means bosminer is not running
          minimum: 0
        control_board_soc_family:
          type: integer
          format: int32
          description: Control board soc family
        detailed_status:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MinerDetailedStatus'
            description: Detailed miner status
        hostname:
          type: string
          description: Hostname
        is_pic_model:
          type:
          - boolean
          - 'null'
          description: Whether the miner has a PIC (Programmable Interrupt Controller) board
        kernel_version:
          type: string
          description: Kernel version
        mac_address:
          type: string
          description: MAC address
        miner_identity:
